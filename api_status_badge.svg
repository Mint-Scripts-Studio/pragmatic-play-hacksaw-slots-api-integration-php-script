<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f1a22;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a2f3a;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Прямоугольник -->
    <rect width="520" height="120" rx="12" fill="url(#bg)" stroke="#2d5b6b" stroke-width="1" filter="url(#shadow)"/>

    <!-- Логотип / иконка -->
    <circle cx="40" cy="40" r="18" fill="#4dc9e8" opacity="0.2"/>
    <circle cx="40" cy="40" r="12" fill="none" stroke="#4dc9e8" stroke-width="2"/>
    <text x="40" y="46" font-family="Arial, sans-serif" font-size="16" fill="#4dc9e8" text-anchor="middle" font-weight="bold">M</text>

    <!-- Название студии -->
    <text x="70" y="30" font-family="Arial, sans-serif" font-size="14" fill="#b3e8f5" font-weight="600">Mint Scripts Studio</text>

    <!-- Версия API -->
    <rect x="70" y="38" width="70" height="22" rx="11" fill="#142f3a" stroke="#2d5b6b" stroke-width="1"/>
    <text x="105" y="53" font-family="Arial, sans-serif" font-size="11" fill="#89d4ea" text-anchor="middle" font-weight="600">API v1.0</text>

    <!-- Статус -->
    <rect x="155" y="38" width="120" height="22" rx="11" fill="#2ea44f" opacity="0.15"/>
    <text x="215" y="53" font-family="Arial, sans-serif" font-size="12" fill="#2ea44f" text-anchor="middle" font-weight="700">✅ ONLINE</text>

    <!-- Uptime -->
    <text x="340" y="30" font-family="Arial, sans-serif" font-size="11" fill="#7bb8cc">uptime</text>
    <text x="340" y="48" font-family="Arial, sans-serif" font-size="18" fill="#c3e2ef" font-weight="700">99.9%</text>

    <!-- Endpoints -->
    <text x="30" y="85" font-family="Arial, sans-serif" font-size="10" fill="#5f8f9f">ENDPOINTS</text>
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="10" fill="#9ac9db">▶ /playGame.do</text>
    <text x="160" y="100" font-family="Arial, sans-serif" font-size="10" fill="#9ac9db">▶ /gameActions.do</text>
    <text x="310" y="100" font-family="Arial, sans-serif" font-size="10" fill="#9ac9db">▶ your-callback-url</text>

    <!-- Провайдеры -->
    <text x="430" y="85" font-family="Arial, sans-serif" font-size="10" fill="#5f8f9f">PROVIDERS</text>
    <text x="430" y="100" font-family="Arial, sans-serif" font-size="10" fill="#9ac9db">pragmatic | hacksaw</text>

    <!-- Время последней проверки -->
    <text x="30" y="115" font-family="Arial, sans-serif" font-size="8" fill="#4f6f7f">last check: 2026-07-11 12:00 UTC</text>

    <!-- Currencies -->
    <text x="430" y="115" font-family="Arial, sans-serif" font-size="8" fill="#4f6f7f">currencies: USD | EUR</text>
</svg>
